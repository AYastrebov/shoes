[package]
name = "shoes"
version = "0.2.20"
edition = "2024"
license = "MIT"
description = "A multi-protocol proxy server."
homepage = "https://github.com/cfal/shoes/"
repository = "https://github.com/cfal/shoes/"
readme = "README.md"
keywords = ["proxy", "proxy-server", "shadowsocks", "v2ray", "vmess"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "shoes"
# rlib = Rust library (for Rust dependencies)
# cdylib = C dynamic library (.so on Linux/Android, .dylib on macOS)
# staticlib = C static library (.a) - required for iOS
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "shoes"
path = "src/main.rs"

[features]
default = []
ffi = []  # Enable FFI module for non-Android builds
# Both of these hold runtime state, which is the budget a phone cannot spare --
# see MOBILE.md, where the per-connection figures are measured and where the
# distinction that matters is drawn: code costs download size and almost no
# RSS, while runtime state costs RSS.
#
# The two are not equal in that cost, and the difference was measured rather
# than assumed. `control-logs` holds a bounded ring of formatted records,
# which is real memory. `control-stats` holds counters, not a table keyed by
# connection: one process-wide atomic, a few hundred bytes per configured
# outbound, and one pointer per live outbound stream -- 2 KiB at the
# 256-connection mobile ceiling, less than one page. That is why the two
# flags ship differently on mobile.
#
# Two flags rather than one `desktop` so each cost stays attributable: an iOS
# extension could take the counters without inheriting a log buffer. That is
# no longer hypothetical -- the published mobile artifacts build with
# `control-stats` and without `control-logs`, which is exactly the split this
# pair of flags was written to allow. See scripts/build-android.sh and
# scripts/build-ios.sh, and MOBILE.md section 10 for what the counters
# measured at the 256-connection ceiling.
#
# The supported combinations stay few -- mobile builds `control-stats`, a
# desktop host builds `desktop` -- rather than the combinatorial matrix
# MOBILE.md warned off. `default = []` stays, so a library consumer still opts
# in and a default build pays nothing.
control-logs = []   # subscribable log stream; bounded in-memory ring
control-stats = []  # counters beyond the two byte totals
desktop = ["control-logs", "control-stats"]
# This build is linked into an Apple Network Extension, so the system kills it
# at a memory cap rather than warning it, and src/buffer_sizing.rs picks the
# constrained per-connection budget.
#
# A feature rather than a `target_os` test because `target_os` cannot answer
# the question. Every iOS build is an extension, but aarch64-apple-darwin is
# both the XCFramework slice Package.swift links into
# ShoesPacketTunnelProvider and the desktop binary, and only the first is
# under a cap. scripts/build-apple.sh sets this; no desktop build does.
network-extension = []
# The macOS privileged daemon (`shoesd`), its gRPC stack and its generated
# protocol code. Off by default and additive: a library consumer, the CLI and
# both mobile artifacts pay nothing for it, and no other platform can build it
# at all -- the dependencies live under a macOS target section, and the arms
# that touch routes and DNS are macOS-only.
#
# Separate from `desktop` even though the daemon always implies it, because
# `desktop` is about what the engine keeps in memory and this is about what
# the process is. A Tauri host wanting the log stream should not have to
# compile tonic.
#
# See docs/specs/2026-09-04-macos-privileged-daemon.md.
daemon = [
    "desktop",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:tokio-stream",
    "dep:tonic-prost-build",
    "dep:serde_json",
]

[[bin]]
name = "shoesd"
path = "src/bin/shoesd/main.rs"
required-features = ["daemon"]

[dependencies]
async-trait = "*"
awgtun = { git = "https://github.com/AYastrebov/awgtun", rev = "65d72ea7d7dfd9740ca8bc1ae59c0d494cd2999e", default-features = false }
aws-lc-rs = { version = "*", default-features = false }
base64 = "*"
blake2 = "*"
blake3 = "*"
bytes = "*"
chacha20poly1305 = "0.10"
chrono = "*"
dashmap = "*"
# Pinned to the major: shake 0.1 implements digest 0.11's XofReader, and a
# wildcard let a re-resolution flip this to 0.10, where the trait does not
# match and vmess_stream stops compiling. Found during the 0.2.10 release.
digest = "0.11"
etherparse = "*"
# rust_backend rather than the default: the C zlib would add a C toolchain
# requirement to the Android and iOS cross-builds.
flate2 = { version = "*", default-features = false, features = ["rust_backend"] }
futures = "*"
pin-project-lite = "*"
h2 = "*"
h3 = "*"
h3-quinn = "*"
hickory-resolver = { version = "*", default-features = false, features = ["tokio", "tls-aws-lc-rs", "https-aws-lc-rs", "h3-aws-lc-rs"] }
http = "*"
http-body-util = "*"
hyper = { version = "*", features = ["server", "http1", "http2"] }
hyper-util = { version = "*", features = ["tokio", "server"] }
indexmap = "*"
libc = "*"
log = { version = "*", features = ["std", "release_max_level_info"] }
lru = "*"
md-5 = "*"
memchr = "*"
mime_guess = "*"
notify = "*"
parking_lot = "*"
percent-encoding = "*"
quinn = { version = "*", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rand = "*"
rand_core = "*"
rcgen = { version = "*", default-features = false, features = ["aws_lc_rs", "pem"] }
# regex-lite, not regex: a few hundred rule-set patterns behind an LRU do not
# justify ~1.5MB of binary on mobile, and its linear-time engine has no ReDoS.
regex-lite = "*"
rust-argon2 = "*"
rustc-hash = "*"
rustls = "*"
serde = { version = "*", features = ["derive", "std"] }
serde_yaml = "*"
shake = "*"
# auto-icmp-echo-reply: without it smoltcp silently ignores echo requests
# (src/iface/interface/ipv4.rs gates the reply arm on it), so `icmp_enabled`
# promised ping support the stack never delivered — found by pinging through
# the Windows TUN and confirmed to be platform-independent.
smoltcp = { version = "*", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-icmp", "socket-udp", "socket-tcp", "socket-tcp-cubic", "phy-tuntap_interface", "assembler-max-segment-count-32", "auto-icmp-echo-reply"] }
socket2 = "*"
subtle = "*"
tokio = { version = "*", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "*", features = ["time"] }
url = "*"
webpki-roots = { version = "*" }
x509-parser = { version = "*", default-features = false, features = ["verify-aws"] }

# Optional so that only a `--features daemon` build compiles it: a build
# dependency costs build time on every target otherwise, including the mobile
# artifacts that will never speak gRPC.
[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
rcgen = { version = "*", default-features = false, features = ["aws_lc_rs", "pem"] }
serde_json = "*"
tempfile = "*"
tokio-rustls = "*"

# Unix only: on Windows the TUN backend drives wintun directly
# (src/tun/wintun_device.rs), and the tun crate's Windows half — wintun
# behind a blocking Read on an internal thread — is exactly the
# double-buffered shape that backend exists to avoid.
[target.'cfg(unix)'.dependencies]
tun = { version = "*", features = ["async"] }

# The daemon's gRPC stack. Optional and macOS-only, so nothing else resolves
# them -- see the `daemon` feature. Pinned to a major rather than "*": tonic's
# server API moved across 0.13 and 0.14 (the codec split into `tonic-prost`,
# and `UdsConnectInfo::peer_addr` gained an Arc), and a silent jump would land
# in the peer-credential check, which is the daemon's whole authentication.
[target.'cfg(target_os = "macos")'.dependencies]
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
# `net` is what carries UnixListenerStream, which is how the listener reaches
# `serve_with_incoming_shutdown`.
tokio-stream = { version = "0.1", features = ["net"], optional = true }
# The revert state file. JSON rather than the YAML this crate already parses:
# it is written by a program and read by a program, never edited by hand, and
# a crash-recovery record wants the format with the fewest ways to be
# ambiguous.
serde_json = { version = "*", optional = true }

# Only the daemon's own tests, to build a client that speaks to a real Unix
# socket. tonic's client takes a URI, so reaching a socket path means handing
# it a connector, and `service_fn` is how that is expressed. Already in the
# graph via tonic; this makes it nameable.
[target.'cfg(target_os = "macos")'.dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(windows)'.dependencies]
# verify_binary_signature: wintun.dll is resolved by the loader's search
# order and this process runs elevated, so an unsigned DLL on that path
# would be a privilege escalation. Refuse it rather than load it.
wintun-bindings = { version = "0.7", features = ["verify_binary_signature"] }
# Only for WaitForMultipleObjects and its constants in the stack thread's
# wait; everything else Windows-shaped goes through wintun-bindings.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

# jemalloc for better memory performance (not supported on Windows MSVC, iOS, or Android)
[target.'cfg(not(any(target_env = "msvc", target_os = "ios", target_os = "android")))'.dependencies]
tikv-jemallocator = "*"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "*"
jni = "0.22"
ndk-sys = "*"

[profile.release]
opt-level = 3
lto = "fat"
strip = true

# The profile the Android and iOS artifacts are built with. Mobile pays for
# code size in download bytes on every install, where a server pays for it
# once, so the two want different trade-offs and get different profiles.
#
# opt-level = "s" rather than 3: measured 38% off the stripped arm64 .so with
# no measurable throughput cost, because the hot paths here are either
# hand-written assembly (aws-lc-sys, blake3) or I/O-bound rather than
# vectorisable loops.
#
# panic = "abort" rather than unwind: this deletes .eh_frame and
# .gcc_except_table, which are ~2 MiB of the baseline on their own. It is also
# the honest setting for this crate. A panic that reaches the JNI or extern "C"
# boundary is undefined behaviour, not a caught error, so the unwind tables buy
# containment we are not entitled to rely on. See install_panic_hook() in
# src/logging.rs — with abort, a panic is the last thing the process does, so it
# has to be logged before it happens or it is lost.
[profile.release-mobile]
inherits = "release"
opt-level = "s"
panic = "abort"
