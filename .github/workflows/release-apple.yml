name: Release Apple

# Release, then tag. A remote binaryTarget in Package.swift needs the
# checksum of the zip for the tag it is on, and that zip comes from that
# tag's build -- so no tag-triggered flow can produce a manifest that names
# its own release. This one builds first, computes the checksum, commits
# Package.swift, pushes the branch, stages a DRAFT release carrying the zip,
# and only then publishes it -- publishing is what creates the tag, at the
# manifest commit. Nothing irreversible happens before the asset is safely
# attached, and a failure after the draft exists is recovered by re-running
# the workflow, which finds the draft and publishes it instead of rebuilding.
#
# The tag this creates is made by the API with the workflow's token, and
# GitHub does not fire on:push workflows for that -- so mobile.yml and
# build.yml are dispatched here, on the tag ref, to attach the AAR and the
# desktop binaries. This workflow is the only producer of
# Shoes.xcframework.zip; mobile.yml's release job attaches the AAR alone and
# checks the manifest actually names its tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.2.15). Must match Cargo.toml.'
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release-apple
  cancel-in-progress: false

jobs:
  release:
    name: Build, checksum, tag, publish
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Through env, never interpolated into scripts: an expression inside
      # run: is expanded before the shell parses, which is an injection.
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide what this run has to do
        id: plan
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "version '$VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "tag v$VERSION already exists -- this version is released"; exit 1
          fi

          if gh release view "v$VERSION" --json isDraft,assets \
               --jq '.isDraft and ([.assets[].name] | index("Shoes.xcframework.zip") != null)' \
               2>/dev/null | grep -q true; then
            # A previous run built, committed and staged the draft, then
            # failed at publish. The zip and the committed checksum agree;
            # rebuilding would break that. Publish what exists.
            echo "mode=publish" >> "$GITHUB_OUTPUT"
            echo "recovering: draft v$VERSION already carries the zip"
          else
            cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
            [ "$cargo_version" = "$VERSION" ] \
              || { echo "Cargo.toml says $cargo_version, input says $VERSION"; exit 1; }
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the XCFramework
        if: steps.plan.outputs.mode == 'full'
        uses: ./.github/actions/build-apple

      - name: Zip, checksum, commit the manifest, stage the draft
        if: steps.plan.outputs.mode == 'full'
        run: |
          set -euo pipefail
          (cd output/apple && zip -r -q Shoes.xcframework.zip Shoes.xcframework/)
          # From the package root: compute-checksum is a package command.
          checksum=$(swift package compute-checksum output/apple/Shoes.xcframework.zip)
          echo "sha256 $checksum"

          sed -i '' "s/^let shoesRelease = \".*\"\$/let shoesRelease = \"v$VERSION\"/" Package.swift
          sed -i '' "s/^let shoesChecksum = \".*\"\$/let shoesChecksum = \"$checksum\"/" Package.swift
          git diff Package.swift

          # Committed as the release author, not as the bot: this is a
          # change to the tree the tag will point at.
          git config user.name "Andrey Yastrebov"
          git config user.email "ayastrebov@gmail.com"
          git add Package.swift
          git commit -m "release: $VERSION"
          git push origin "HEAD:$GITHUB_REF_NAME"

          # Draft: carries the tag NAME and the asset, creates no tag yet.
          gh release create "v$VERSION" \
            --draft \
            --target "$(git rev-parse HEAD)" \
            --title "v$VERSION" \
            --generate-notes \
            output/apple/Shoes.xcframework.zip

      # Publishing the draft is the one irreversible step: it creates the
      # tag at the draft's target commit -- the manifest commit.
      - name: Publish
        run: gh release edit "v$VERSION" --draft=false

      # The tag now exists, made by the API with this workflow's token, which
      # fires no on:push workflow. Dispatch the two that attach the rest of
      # the release on the tag ref; their release jobs see refs/tags/v* and
      # run, and action-gh-release appends to the existing release.
      - name: Dispatch the AAR and desktop-binary builds onto the tag
        run: |
          set -euo pipefail
          gh workflow run mobile.yml --ref "v$VERSION"
          gh workflow run build.yml --ref "v$VERSION"
          echo "Dispatched mobile.yml and build.yml on v$VERSION; their release"
          echo "jobs attach the AAR and the desktop binaries."
