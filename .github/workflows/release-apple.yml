name: Release Apple

# Release, then tag. A remote binaryTarget in Package.swift needs the
# checksum of the zip for the tag it is on, and that zip comes from that
# tag's build -- so no tag-triggered flow can produce a manifest that names
# its own release. This one builds first, computes the checksum, commits
# Package.swift, pushes the branch, uploads the zip to a DRAFT release, and
# only then publishes it -- publishing is what creates the tag, at the
# manifest commit. Nothing irreversible happens before every asset is
# safely attached, and a failure after the draft exists is recovered by
# re-running the workflow, which finds the draft and finishes it.
#
# The AAR and the desktop binaries are built at the same time as the
# framework, not after it: the draft is created first, and mobile.yml and
# build.yml are dispatched on the branch with its tag name, so their
# release jobs upload to the draft while this job builds the framework.
# Publishing waits for both. They build from the bump commit, one commit
# before the tag's manifest commit; the trees differ only in
# Package.swift, which no binary reads. Before 2026-10-28 they were
# dispatched after the publish, onto the tag, and the release took the sum
# of the three builds instead of the slowest.
#
# Three jobs, so only the framework build waits for a macOS runner. `plan`
# (Ubuntu) validates, creates the draft and dispatches the fan-out;
# `framework` (macOS) builds, commits the manifest and uploads the zip, and
# runs only when the draft does not carry the zip yet; `publish` (Ubuntu)
# waits for the fan-out, checks the assets and publishes. A re-run after a
# failure past the manifest commit -- finish mode -- therefore needs no
# macOS runner of its own. Until 2026-10-28 it was one macOS job, and the
# 0.9.0 recovery run was cancelled for want of a runner it did not need.
#
# This workflow is the only producer of Shoes.xcframework.zip. A tag
# pushed by hand still runs build.yml and mobile.yml on the tag, and
# mobile.yml's release job checks the manifest actually names that tag.
#
# `dry_run` exercises everything against a draft named v<version>-dryrun
# -- the fan-out, the framework build, the uploads, the wait -- and
# deletes the draft at the end instead of publishing, with no commit and
# no push. Run it from a branch to test a change to this flow.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the v (e.g. 0.2.15). Must match Cargo.toml.'
        required: true
      dry_run:
        description: 'Build and attach everything to a throwaway draft, then delete it. No commit, no tag.'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: release-apple
  cancel-in-progress: false

jobs:
  plan:
    name: Plan, draft, dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Through env, never interpolated into scripts: an expression inside
      # run: is expanded before the shell parses, which is an injection.
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      started: ${{ steps.plan.outputs.started }}
      binaries: ${{ steps.dispatch.outputs.binaries }}
      aar: ${{ steps.dispatch.outputs.aar }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Decide what this run has to do
        id: plan
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "version '$VERSION' is not MAJOR.MINOR.PATCH"; exit 1; }

          if [ "$DRY_RUN" = "true" ]; then
            tag="v$VERSION-dryrun"
            echo "dry run: the draft is $tag, nothing is committed or published"
          else
            tag="v$VERSION"
            if git rev-parse "$tag" >/dev/null 2>&1; then
              echo "tag $tag already exists -- this version is released"; exit 1
            fi
            cargo_version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
            [ "$cargo_version" = "$VERSION" ] \
              || { echo "Cargo.toml says $cargo_version, input says $VERSION"; exit 1; }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # A previous run built, committed and uploaded the framework, then
          # failed later. The zip and the committed checksum agree;
          # rebuilding would break that. Skip the framework job and go
          # straight to the wait and the publish, re-dispatching only what is
          # missing.
          if gh release view "$tag" --json isDraft,assets \
               --jq '.isDraft and ([.assets[].name] | index("Shoes.xcframework.zip") != null)' \
               2>/dev/null | grep -q true; then
            echo "mode=finish" >> "$GITHUB_OUTPUT"
            echo "recovering: draft $tag already carries the framework"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
          fi
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The draft first, so the fan-out builds have something to upload to
      # while the framework builds. It carries the tag NAME and no tag yet;
      # its target moves to the manifest commit before publish.
      - name: Create the draft
        if: steps.plan.outputs.mode == 'full'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "draft $TAG exists from an earlier attempt; keeping it"
          else
            gh release create "$TAG" --draft --target "$(git rev-parse HEAD)" \
              --title "$TAG" --generate-notes
          fi

      # Both at once, on this branch, uploading to the draft by its name.
      # On a finish-mode re-run only the builds whose assets are missing
      # are dispatched again.
      - name: Dispatch the AAR and desktop-binary builds
        id: dispatch
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --json assets --jq '[.assets[].name] | join(" ")')
          need_binaries=false; need_aar=false
          for a in shoes-linux-x86_64.tar.gz shoes-linux-x86_64-musl.tar.gz shoes-linux-arm64.tar.gz \
                   shoes-linux-arm64-musl.tar.gz shoes-macos-arm64.tar.gz shoes-windows-x86_64.tar.gz \
                   shoes-windows-arm64.tar.gz shoesd-linux-x86_64.tar.gz shoesd-linux-arm64.tar.gz \
                   shoesd-macos-arm64.tar.gz shoesd-windows-x86_64.tar.gz shoesd-windows-arm64.tar.gz; do
            case " $assets " in *" $a "*) ;; *) need_binaries=true ;; esac
          done
          case " $assets " in *" shoes-release.aar "*) ;; *) need_aar=true ;; esac
          if [ "$need_binaries" = true ]; then
            gh workflow run build.yml --ref "$GITHUB_REF_NAME" -f "release_tag=$TAG"
            echo "dispatched build.yml for $TAG"
          fi
          if [ "$need_aar" = true ]; then
            gh workflow run mobile.yml --ref "$GITHUB_REF_NAME" -f "release_tag=$TAG"
            echo "dispatched mobile.yml for $TAG"
          fi
          echo "binaries=$need_binaries" >> "$GITHUB_OUTPUT"
          echo "aar=$need_aar" >> "$GITHUB_OUTPUT"

  # The one job that needs macOS, and it runs only when the draft does not
  # carry the framework yet.
  framework:
    name: Build, checksum, commit the manifest
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build the XCFramework
        uses: ./.github/actions/build-apple

      - name: Zip, checksum, commit the manifest, upload to the draft
        run: |
          set -euo pipefail
          (cd output/apple && zip -r -q Shoes.xcframework.zip Shoes.xcframework/)
          # From the package root: compute-checksum is a package command.
          checksum=$(swift package compute-checksum output/apple/Shoes.xcframework.zip)
          echo "sha256 $checksum"

          if [ "$DRY_RUN" != "true" ]; then
            sed -i '' "s/^let shoesRelease = \".*\"\$/let shoesRelease = \"$TAG\"/" Package.swift
            sed -i '' "s/^let shoesChecksum = \".*\"\$/let shoesChecksum = \"$checksum\"/" Package.swift
            git diff Package.swift

            # Committed as the release author, not as the bot: this is a
            # change to the tree the tag will point at.
            git config user.name "Andrey Yastrebov"
            git config user.email "ayastrebov@gmail.com"
            git add Package.swift
            git commit -m "release: $VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"

            # The tag the publish creates points at the manifest commit.
            gh release edit "$TAG" --target "$(git rev-parse HEAD)"
          fi

          gh release upload "$TAG" output/apple/Shoes.xcframework.zip --clobber

  publish:
    name: Wait, check, publish
    needs: [plan, framework]
    # After the framework job, or without it in finish mode. `always()` is
    # what lets a skipped `framework` through; the result checks keep a
    # failed or cancelled one from publishing.
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.framework.result == 'success' || needs.framework.result == 'skipped')
    runs-on: ubuntu-latest
    # The wait is for the slowest fan-out build, a macOS one that may queue.
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}

    steps:
      # The runs the plan job dispatched: the newest workflow_dispatch run
      # of each workflow on this branch since the plan step. Watched to
      # completion; a failed or cancelled one fails the release before the
      # publish, and a re-run of this workflow dispatches it again.
      - name: Wait for the AAR and desktop-binary builds
        env:
          STARTED: ${{ needs.plan.outputs.started }}
          NEED_BINARIES: ${{ needs.plan.outputs.binaries }}
          NEED_AAR: ${{ needs.plan.outputs.aar }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          wait_for() {
            local workflow="$1" id=""
            for attempt in $(seq 1 30); do
              id=$(gh run list --repo "$REPO" --workflow "$workflow" --branch "$GITHUB_REF_NAME" \
                     --event workflow_dispatch --created ">=$STARTED" --limit 1 \
                     --json databaseId --jq '.[0].databaseId // empty')
              [ -n "$id" ] && break
              sleep 10
            done
            [ -n "$id" ] || { echo "no $workflow run appeared after $STARTED"; exit 1; }
            echo "waiting for $workflow run $id"
            gh run watch "$id" --repo "$REPO" --exit-status --interval 30 >/dev/null
            echo "$workflow run $id succeeded"
          }
          [ "$NEED_BINARIES" = true ] && wait_for build.yml
          [ "$NEED_AAR" = true ] && wait_for mobile.yml
          true

      - name: Check every asset is attached
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '[.assets[].name] | join(" ")')
          missing=""
          for a in Shoes.xcframework.zip shoes-release.aar \
                   shoes-linux-x86_64.tar.gz shoes-linux-x86_64-musl.tar.gz shoes-linux-arm64.tar.gz \
                   shoes-linux-arm64-musl.tar.gz shoes-macos-arm64.tar.gz shoes-windows-x86_64.tar.gz \
                   shoes-windows-arm64.tar.gz shoesd-linux-x86_64.tar.gz shoesd-linux-arm64.tar.gz \
                   shoesd-macos-arm64.tar.gz shoesd-windows-x86_64.tar.gz shoesd-windows-arm64.tar.gz; do
            case " $assets " in *" $a "*) ;; *) missing="$missing $a" ;; esac
          done
          [ -z "$missing" ] || { echo "draft $TAG is missing:$missing"; exit 1; }
          echo "all 14 assets attached to $TAG"

      # Publishing the draft is the one irreversible step: it creates the
      # tag at the draft's target -- the manifest commit. The tag is made
      # by the API with this workflow's token, which fires no on:push
      # workflow, and nothing needs to: every asset is already attached.
      - name: Publish
        if: inputs.dry_run != true
        env:
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

  # Its own job so a dry run cleans up whichever job it failed in.
  dry-run-cleanup:
    name: Delete the dry-run draft
    needs: [plan, framework, publish]
    if: always() && inputs.dry_run == true && needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - run: gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag || true
