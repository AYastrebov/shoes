name: Build Mobile Libraries

# Which job runs when:
#
# - apple + swift (the XCFramework and the Swift package): a manual run
#   only. release-apple.yml builds the framework that ships.
# - macos (the C surface): pull requests and branch pushes that touch the
#   FFI or the header, and manual runs; not on a release.
# - android (the AAR): pull requests, tags, release dispatches, manual runs
#   and the nightly when the branch moved; not on a branch push.
# - release (attach the AAR): tags and release dispatches.
#
# The cost that stands: the Swift package is checked only when someone
# runs this workflow by hand, and the Android build is not compiled on a
# branch push. Run it (Actions -> Run workflow, no release_tag) before a
# release if swift/, Package.swift, the JNI layer or a build script
# changed. Path filters are not evaluated for tag pushes.
on:
  push:
    tags: [ 'v*' ]
    branches: [ master, mobile ]
    # What the macOS C-surface job checks; the Apple framework and Swift
    # jobs no longer run on a push (see the apple job).
    paths:
      - 'include/**'
      - 'src/ffi/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    branches: [ master, mobile ]
    # Only when what the two PR jobs check changed: the C surface (macOS)
    # and the AAR (Android). Lint already compiles the library for every
    # mobile target on every PR -- the FFI configuration on macOS,
    # `aarch64-apple-ios`, and Android through cargo ndk -- so an ordinary
    # Rust change is checked there. Dependencies are in the list because a
    # bump is how a cross build stops linking. The Apple framework and the
    # Swift package are not built on a PR at all (see the apple job). Before
    # 2026-10-28 every non-docs PR paid for three macOS jobs here.
    paths:
      - 'include/**'
      - 'src/ffi/**'
      - 'android/**'
      - 'scripts/build-android.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - '.cargo/**'
      - '.github/workflows/mobile.yml'
  # Nightly, on the default branch: the android job alone (the macOS jobs
  # are guarded below), so the tag build's AAR restores a warm cache
  # instead of compiling three ABIs cold.
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        # Set by release-apple.yml: build the AAR on this branch and upload
        # it to the draft release of that name. Empty for a plain dispatch.
        description: 'Draft release to upload the AAR to (release-apple.yml sets this)'
        default: ''

permissions:
  contents: read

# A release dispatch (release_tag set) is in a group of its own, by run id,
# and is never cancelled: it was sharing `<workflow>-refs/heads/mobile` with
# every other run on the branch, so on 2026-10-28 a re-run of an older
# release build cancelled the 0.9.0 finish run's fresh one, and the 03:xx
# nightly would have cancelled any release build still going. The event is
# in the group so the nightly and a branch push do not cancel each other
# either. Everything else keeps the newest-run-wins rule.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('release-{0}', github.run_id) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ !inputs.release_tag }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The nightly's reason to run is a change since the last one: a nightly
  # over an unchanged `mobile` rebuilds what the last one built. So a
  # scheduled run first asks whether HEAD differs from the last successful
  # scheduled run's commit, and skips when it does not -- unless that run is
  # six days old, so the caches it keeps warm are touched inside GitHub's
  # seven-day eviction window. Any other event runs, and so does a nightly
  # whose question cannot be answered.
  changed:
    name: Changed since the last nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          WORKFLOW: mobile.yml
        run: |
          set -uo pipefail
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The last successful scheduled run that built something. A night
          # this job skipped also ends in success, and must not count, or an
          # unchanged branch would never reach the six-day refresh.
          last=""
          runs=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --event schedule \
                   --status success --limit 20 --json databaseId,headSha,createdAt \
                   --jq '.[] | "\(.databaseId) \(.headSha) \(.createdAt)"' 2>/dev/null) || runs=""
          while read -r id run_sha run_created; do
            [ -n "$id" ] || continue
            built=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                      --jq '[.jobs[] | select(.name != "Changed since the last nightly"
                                              and .conclusion == "success")] | length' \
                      2>/dev/null) || built=0
            if [ "${built:-0}" -gt 0 ]; then last="$run_sha $run_created"; break; fi
          done <<< "$runs"
          sha=${last%% *}; created=${last#* }
          if [ -z "$last" ] || [ "$sha" != "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "running: last successful nightly was at ${sha:-none}, HEAD is $GITHUB_SHA"
          elif [ $(( $(date +%s) - $(date -d "$created" +%s) )) -gt $(( 6 * 86400 )) ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "running: HEAD unchanged, but the last nightly ($created) is six days old"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipping: the nightly of $created already built $GITHUB_SHA"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Apple — XCFramework (iOS device arm64, iOS simulator arm64, macOS arm64)
  # ──────────────────────────────────────────────────────────────────────────
  apple:
    name: Build Apple XCFramework
    runs-on: macos-latest
    # Only on a manual run of this workflow, never on a pull request, a
    # push, a tag or the nightly. The framework is built for real by
    # release-apple.yml, the sole builder of what ships; building it here as
    # well cost two macOS jobs of up to an hour on every PR that touched the
    # packaging, for an artifact nothing downloads. Run this workflow by
    # hand (Actions -> Run workflow, no release_tag) before a release when
    # swift/, Package.swift or the build script changed: the swift job,
    # which follows this gate through needs:, is the only place the Swift
    # package is linted, tested, typechecked for iOS and link-checked.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release_tag }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The build itself is a composite action, shared with release-apple.yml
      # so the artifact that ships is built exactly as the one CI tested.
      - name: Build the XCFramework
        uses: ./.github/actions/build-apple

      - name: Upload XCFramework
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Shoes.xcframework
          path: output/apple/Shoes.xcframework
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Swift — the ShoesTunnel package against the framework the apple job built
  # ──────────────────────────────────────────────────────────────────────────
  swift:
    name: Build and test ShoesTunnel
    needs: [ apple ]
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned rather than inherited: Swift 6 language mode and the iOS 18
      # SDK have a floor, and macos-latest moves without notice.
      - name: Select Xcode
        run: |
          set -euo pipefail
          # The newest Xcode 26 the image carries, else whatever is default;
          # either way the toolchain must be Swift 6, which the check below
          # says in the log rather than leaving to a compile error later.
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode"
          fi
          xcode-select -p
          swift --version
          swift --version 2>&1 | grep -qE 'Swift version ([6-9]|[1-9][0-9])\.' \
            || { echo "Swift 6 or newer is required"; exit 1; }

      # Downloaded, not rebuilt: the apple job already spent the minutes.
      - name: Download the XCFramework
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Shoes.xcframework
          path: output/apple/Shoes.xcframework

      - name: Lint
        run: swift format lint --strict --recursive swift Package.swift

      - name: Build and test (macOS)
        env:
          SHOES_LOCAL_XCFRAMEWORK: "1"
        run: |
          swift build
          swift test

      # The macOS build above exercises the macos-arm64 slice only. This
      # typechecks the package against the iOS SDK so the slice a consumer
      # links on a phone cannot rot while only macOS is tested.
      # shell: bash is load-bearing: GitHub's explicit-bash form runs with
      # -o pipefail, so xcodebuild's exit status survives the pipe. The
      # default shell for a bare `run:` does not, and this step -- the only
      # iOS compile in the pipeline -- was green on failure.
      - name: Typecheck (iOS)
        shell: bash
        env:
          SHOES_LOCAL_XCFRAMEWORK: "1"
        run: |
          xcodebuild -scheme ShoesTunnel     -destination 'generic/platform=iOS' build | tail -20
          xcodebuild -scheme ShoesTunnelHost -destination 'generic/platform=iOS' build | tail -20

      # The property the ShoesTunnelHost product exists for: an app that
      # links it carries no engine. Host is guaranteed by the graph (Host
      # never depends on ShoesFFI), so the count is a guard against that
      # dependency coming back; the extension count > 0 proves the check
      # reads real binaries. __TEXT is printed so the README number can be
      # re-measured from the log. ARCHS=arm64 because the framework's
      # simulator slice is arm64 only and the generic destination would
      # otherwise ask for x86_64 too.
      - name: Link check (iOS Simulator, Release)
        shell: bash
        env:
          SHOES_LOCAL_XCFRAMEWORK: "1"
        run: |
          set -euo pipefail
          for s in HostLinkCheck ExtensionLinkCheck; do
            xcodebuild -scheme "$s" -configuration Release \
              -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
              CODE_SIGNING_ALLOWED=NO -derivedDataPath build/linkcheck build | tail -5
          done
          host=$(find build/linkcheck/Build/Products -type f -perm +111 -name HostLinkCheck | head -1)
          ext=$(find build/linkcheck/Build/Products -type f -perm +111 -name ExtensionLinkCheck | head -1)
          test -n "$host" && test -n "$ext"
          host_n=$(nm -U "$host" | grep -c ' T _shoes_' || true)
          ext_n=$(nm -U "$ext" | grep -c ' T _shoes_' || true)
          echo "shoes_* in host: $host_n; in extension: $ext_n"
          size -m "$host" | grep __TEXT
          size -m "$ext"  | grep __TEXT
          [ "$host_n" -eq 0 ] || { echo "engine symbols reached the host executable"; exit 1; }
          [ "$ext_n" -gt 0 ] || { echo "no engine symbols in the extension: check is not reading real binaries"; exit 1; }

  # ──────────────────────────────────────────────────────────────────────────
  # macOS — the C surface the desktop Network Extension provider links
  # ──────────────────────────────────────────────────────────────────────────
  macos:
    name: Check the macOS C surface
    runs-on: macos-latest
    # On branch pushes too, unlike android: the push paths include
    # src/ffi/** and include/**, and this job holds the symbol-count check
    # and the FFI tests -- the checks those paths exist to trigger. The
    # apple job regenerates the header rather than verifying it, so without
    # this a push could drift the surface and stay green until a PR.
    #
    # Not on a tag, for the apple job's reason: the tagged commit passed
    # this check as a PR, and the release job attaches nothing this job
    # makes. On the v0.8.4 tag it cost twelve macOS minutes and, when no
    # macOS runner came, turned the tag's run red for no asset's sake.
    #
    # Nor on a release dispatch, for the same reason: it attaches only the
    # AAR. On 0.9.0 this job got no macOS runner and turned the release's
    # mobile run red although the AAR had attached.
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' && !inputs.release_tag }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: macos-ffi
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      # The desktop client's privileged host on macOS is a Network Extension
      # provider, which is Swift and so consumes the same C API as iOS -- the
      # provider is handed a descriptor by packetFlow either way. Building it
      # here means a change to the FFI cannot break the macOS host silently.
      #
      # control-stats as well, so the body of shoes_get_stats is compiled and
      # linked here rather than only on a tag build. The symbol itself is
      # unconditional, which is what keeps the check below counting the same
      # list whichever features are on.
      # release-mobile, not --release: it is the profile every shipping FFI
      # artifact uses, and the panic = "abort" it carries is now enforced by
      # a compile guard in src/ffi/mod.rs -- an unwinding FFI build would
      # unwind across extern "C" (UB) and report a panicking engine as a
      # clean stop. Checking the surface of the profile that ships also
      # makes this job verify the right artifact.
      - name: Build staticlib
        run: cargo build --locked --profile release-mobile --features ffi,control-stats --target aarch64-apple-darwin

      - name: Verify the C surface matches include/shoes.h
        run: |
          set -uo pipefail
          # The dylib, not the staticlib. `strip = true` in [profile.release]
          # reaches the archive's symbol table on newer toolchains -- this check
          # read 10 symbols on a developer's rustc 1.94 and zero on CI's 1.98,
          # from an archive that was otherwise 28MB larger. A dynamic library
          # has to keep its exported symbols to be linkable at all, and that
          # export list is the ABI a Swift provider actually binds to.
          lib=target/aarch64-apple-darwin/release-mobile/libshoes.dylib
          if [ ! -f "$lib" ]; then
            echo "$lib not found"
            ls -la target/aarch64-apple-darwin/release-mobile/ | head -20
            exit 1
          fi

          echo "--- exported ---"
          nm -gj "$lib" 2>/dev/null | grep '^_shoes_' | sed 's/^_//' | sort || true

          exported=$(nm -gj "$lib" 2>/dev/null | grep -c '^_shoes_' || true)
          declared=$(grep -cE '^[a-z].*shoes_[a-z_]+\(' include/shoes.h)
          echo "$exported symbols exported, $declared declared in include/shoes.h"
          if [ "$exported" -ne "$declared" ]; then
            echo "The macOS build and the header disagree. Regenerate the header"
            echo "with cbindgen, or check what stopped being exported."
            echo "--- declared ---"
            grep -oE 'shoes_[a-z_]+\(' include/shoes.h | tr -d '(' | sort -u
            exit 1
          fi

      # Last, so nothing can disturb the dylib the check above reads. A check
      # rather than a build: this exists to compile the not(control-stats)
      # arms of src/ffi/ios.rs, which return NULL. test.yml now has a macOS
      # runner and so does compile the module, but only with the feature on --
      # this is still the one place the arms without it are seen.
      - name: Check the FFI surface with stats off
        run: cargo check --locked --profile release-mobile --lib --features ffi --target aarch64-apple-darwin

      # src/ffi/ios.rs carries tests that only compile where the module does.
      # test.yml's macOS runner covers them on the host profile; this runs
      # them against release-mobile and the pinned target, which is the
      # artifact that actually ships.
      - name: Test the FFI module
        run: "cargo test --locked --lib --features ffi,control-stats --target aarch64-apple-darwin ffi::"

  # ──────────────────────────────────────────────────────────────────────────
  # Android — AAR with JNI .so for arm64-v8a, armeabi-v7a, x86_64 (emulator)
  # ──────────────────────────────────────────────────────────────────────────
  android:
    name: Build Android AAR
    needs: changed
    runs-on: ubuntu-latest
    # Not on a branch push: see the trigger comment at the top. Nor on a
    # nightly over an unchanged branch: see `changed`.
    if: >-
      (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')) &&
      needs.changed.outputs.run == 'true'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: android
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install cargo-ndk
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: cargo-ndk

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 9.8.2 is the current release; AGP 9.4 needs at least 9.6.
      # Every build publishes a Build Scan to scans.gradle.com, the free
      # public instance: a link in the job log to the task timeline, the
      # cache hits and misses and the dependency graph, which is what a
      # slow AAR build has to be read from. The repository is public, so
      # nothing in the scan is secret; the terms-of-use inputs are the
      # action's required acknowledgement for publishing there.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.8.2'
          build-scan-publish: true
          build-scan-terms-of-use-url: 'https://gradle.com/terms-of-service'
          build-scan-terms-of-use-agree: 'yes'

      # Both, and to the same NDK: the runner presets ANDROID_NDK_ROOT to an
      # older install than ANDROID_NDK_LATEST_HOME, and cargo-ndk warns when
      # the two disagree.
      - name: Set NDK path
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # This job used to inline `cargo ndk ... && gradle assembleRelease`
      # instead of calling the script, and so skipped the step at
      # scripts/build-android.sh:66 that deletes the cdylibs cargo-ndk copies
      # in alongside libshoes.so. The released AAR therefore still carried
      # libboringtun-*.so on every ABI while a local build did not. Calling the
      # script keeps one definition of how the AAR is built.
      - name: Build AAR
        run: bash scripts/build-android.sh

      # The desktop control API is meant to cost mobile as close to nothing as
      # it can. This is what turns that intention into something CI can reject:
      # a checked-in number, raised deliberately, in the same spirit as the
      # LINT_TOOLCHAIN pin in lint.yml.
      - name: Check the arm64 library against the size baseline
        run: |
          set -euo pipefail
          # The exact path, not a find: target/.../deps/ holds a second
          # libshoes.so and picking between them by directory order would make
          # this check nondeterministic.
          so=target/aarch64-linux-android/release-mobile/libshoes.so
          [ -f "$so" ] || { echo "$so not found"; exit 1; }
          actual=$(stat -c %s "$so")
          baseline=$(grep -v '^#' mobile-size-baseline.txt | tr -d '[:space:]')
          # A band, not an exact ceiling. The baseline is recorded from a
          # developer's build, while this job compiles with an unpinned stable
          # rustc and the runner's own NDK -- a compiler bump moves the size by
          # kilobytes on its own, and a hard ceiling would fail PRs that
          # touched nothing relevant. 2% of ~9.7MB is ~195KB: wide enough to
          # absorb that drift, narrow enough that anything worth calling a
          # regression trips it.
          ceiling=$((baseline + baseline * 2 / 100))
          echo "arm64 libshoes.so: $actual bytes (baseline $baseline, ceiling $ceiling)"
          if [ "$actual" -gt "$ceiling" ]; then
            over=$((actual - baseline))
            echo "Over the baseline by $over bytes, past the 2% band."
            echo "If the growth is intended, raise mobile-size-baseline.txt in a"
            echo "commit that says what bought the bytes. If it is not, note that"
            echo "this number came from a local build -- check a toolchain bump"
            echo "before assuming the code did it."
            exit 1
          fi

      # And verify it, so the divergence cannot come back silently.
      - name: Verify AAR ships only libshoes.so
        run: |
          set -euo pipefail
          aar=output/android/shoes-release.aar
          libs=$(unzip -Z1 "$aar" | grep '^jni/.*\.so$' || true)
          if [ -z "$libs" ]; then
            echo "No native libraries in $aar"
            exit 1
          fi
          echo "$libs"
          unexpected=$(echo "$libs" | grep -v '/libshoes\.so$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected native libraries in the AAR:"
            echo "$unexpected"
            exit 1
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            echo "$libs" | grep -q "^jni/$abi/libshoes\.so$" \
              || { echo "Missing libshoes.so for $abi"; exit 1; }
          done

      - name: Upload AAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shoes-android
          path: output/android/shoes-release.aar
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────────────
  # Release — attach artifacts to GitHub releases on tag pushes
  # ──────────────────────────────────────────────────────────────────────────
  release:
    name: Attach to Release
    # android only: apple is skipped on tags (above), and this job attaches
    # nothing the apple job makes. Runs on a tag push, or when
    # release-apple.yml dispatched this run with the draft's name.
    needs: [ android ]
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A tag pushed by hand -- git tag && git push, the old habit -- reaches
      # here with a manifest that names no published framework, and every
      # SwiftPM consumer of that tag would fail to resolve. Fail the release
      # loudly instead of shipping it quietly broken. Tag pushes only: on a
      # dispatch from release-apple.yml the manifest is being written by
      # that very workflow while this runs.
      - name: Check the manifest names this release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          release=$(grep -m1 '^let shoesRelease' Package.swift | sed 's/.*"\(.*\)"/\1/')
          checksum=$(grep -m1 '^let shoesChecksum' Package.swift | sed 's/.*"\(.*\)"/\1/')
          zeros=$(printf '0%.0s' $(seq 64))
          if [ "$release" != "$GITHUB_REF_NAME" ] || [ "$checksum" = "$zeros" ]; then
            echo "Package.swift names '$release' (checksum ${checksum:0:8}...) but the tag is '$GITHUB_REF_NAME'."
            echo "This tag was pushed by hand. Apple releases are cut by the 'Release Apple'"
            echo "workflow, which publishes the XCFramework and commits its checksum into"
            echo "Package.swift before tagging. Delete this tag and run Release Apple."
            exit 1
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      # The AAR only, by name. Shoes.xcframework.zip is attached by
      # release-apple.yml, which computes the checksum Package.swift names
      # and commits it before the tag exists. Re-attaching a rebuilt zip
      # here would overwrite that asset with a byte-different one -- zip
      # timestamps alone -- and break every consumer's checksum. This job
      # must be unable to touch it, not merely unlikely to: the upload
      # names one file. The release exists before this runs, as a draft
      # from release-apple.yml or as the published release build.yml made
      # for a hand-pushed tag; gh resolves a draft by its tag name.
      - name: Attach to release
        run: |
          set -euo pipefail
