name: Test

on:
  push:
    branches: [ master, mobile ]
    tags: [ 'v*' ]
    # Documentation changes nothing these jobs check: no code, test or
    # build reads a Markdown file. Path filters are not evaluated for tag
    # pushes, so a tag still runs everything.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [ master, mobile ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # One job, four platforms, identical commands. This was two jobs — a Linux
  # one and a Windows one running a narrower `--lib --bins` subset without the
  # ffi configuration — until the wintun backend made the full suite pass on
  # Windows; separate jobs with hand-copied steps is how the narrower subset
  # would have quietly stayed narrower forever.
  #
  # Both architectures of both platforms, natively: the arm64 hosted runners
  # are free for public repositories, and the release ships arm64 binaries
  # whose code paths otherwise only ever ran on x86_64.
  #
  # On Windows the wintun-specific half (adapter creation, the event wait)
  # stays behind an #[ignore]d test that needs Administrator and wintun.dll,
  # run by hand — see docs/specs/2026-08-27-windows-tun-backend.md.
  #
  # macOS joined late, and its absence had been costing more than it looked.
  # Every `cfg(target_os = "macos")` arm — TUN device creation, the validation
  # arm and its tests, the macOS branch of the example check — was compiled by
  # nobody in CI, on the platform where the least of it had ever run.
  test:
    name: Unit Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest, windows-11-arm]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      # Replaces three hand-rolled actions/cache steps that keyed only on the
      # Cargo.lock hash with no restore-keys, so any dependency change meant a
      # completely cold rebuild. rust-cache handles the registry, the git
      # checkouts and target/ together, and keys on the compiler version too.
      # cache-on-failure, because the run that needs the cache most is the
      # retry of one that just failed.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: test-${{ matrix.runner }}
          cache-on-failure: true
          # Pull requests restore the base branch's cache and save nothing:
          # a PR's saves are visible only to that PR, and at the repository's
          # 10 GB cap they evicted the caches every tag and release build
          # needs. Pushes to mobile and the nightly are what save.
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install aws-lc build tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/aws-lc-tools

      # No separate `cargo build` step: `cargo test` builds what it needs, and
      # doing both compiled the tree twice. No --verbose either -- it buried
      # the failure that mattered under everything that did not.
      - name: Run tests
        run: cargo test --locked

      # The example configs, parsed end to end by the binary the tests just
      # built. This loop lived in build.yml, which ran the whole release
      # matrix on every pull request to get it; here it costs nothing extra.
      # build.yml keeps its copy for the release binary, on tags and nightly.
      - name: Smoke test the examples
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/debug/shoes"
          [ "$RUNNER_OS" = "Windows" ] && bin="$bin.exe"
          "$bin" --version
          configs="socks_basic multi_hop_chain sniff hysteria2_client tuic_client mieru_client reality_client socks_through_wss_vmess"
          case "$RUNNER_OS" in
            Linux) configs="$configs tun_vpn tun_fake_ip tun_windows amneziawg_client transparent_proxy" ;;
            Windows) configs="$configs tun_windows" ;;
            macOS) configs="$configs amneziawg_client tun_macos" ;;
          esac
          for cfg in $configs; do
            echo "==> dry run: examples/$cfg.yaml"
            "$bin" --dry-run "examples/$cfg.yaml"
          done
          cp tests/data/rule_sets/geosite-google.srs tests/data/rule_sets/geoip-ru.srs examples/
          echo "==> dry run: examples/rule_set.yaml"
          "$bin" --dry-run examples/rule_set.yaml
          rm -f examples/geosite-google.srs examples/geoip-ru.srs

      # The `ffi` feature gates src/tun/platform.rs and the protect_socket call
      # in src/amneziawg/tunnel.rs:79. Without this the socket-protection code
      # is never compiled by CI on any runner, because the alternative gates
      # are target_os = "android" / "ios".
      # Not on Windows: the FFI ships to Android and Apple only, and the
      # host-profile run here covers the shared session code on the other
      # four runners. A compile per PR saved at no coverage cost.
      - name: Run tests with the FFI surface enabled
        if: runner.os != 'Windows'
        run: cargo test --locked --features ffi

      # The desktop host builds with these; nothing else should. Running both
      # ends of the matrix is what keeps `default = []` honest -- these two
      # features hold runtime state, and mobile must not inherit it.
      - name: Run tests with the desktop control surface enabled
        run: cargo test --locked --features desktop

      # The redirect and tproxy inbounds under real netfilter rules, which
      # need root. Built as the runner and run under sudo, so nothing in
      # target/ ends up owned by root and the cache step can still read it.
      # The tools are named explicitly so an image that drops one fails here,
      # not as a test error; setcap is libcap2-bin, unshare and nsenter
      # util-linux (the LAN client's namespace).
      - name: Transparent inbound tests (root)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          command -v iptables
          command -v ip
          command -v setcap
          command -v unshare
          command -v nsenter
          test_bin=$(cargo test --locked --test transparent --no-run --message-format=json \
            | jq -r 'select(.executable != null and .target.name == "transparent") | .executable')
          sudo "$test_bin" --ignored

      # The privileged daemon, which exists on macOS, Linux and Windows: its
      # dependencies sit under a target section naming all three. Without this
      # its tests -- the revert sequencing, the peer check, the unit and plist
      # rendering, the service tests over a real socket -- run nowhere.
      #
      # protoc is an install step rather than a crate: prost-build stopped
      # vendoring one.
      # The daemon builds on macOS, Linux and Windows, and every arm needs
      # running: the `HostNetwork` implementations share a trait and a
      # sequencer but no code, so a change to one compiles perfectly while
      # breaking another.
      # Gating this to macOS meant the Linux arm -- five thousand lines of it --
      # compiled in no CI job at all.
      - name: Install protoc
        uses: ./.github/actions/protoc

      # Every runner. On Windows the service tests run over a real AF_UNIX
      # socket with the real token-based peer check, unprivileged.
      - name: Run tests with the privileged daemon enabled
        run: cargo test --locked --features daemon
