name: Build Binaries

# Tags only, plus pull requests and manual runs. A branch push runs Test and
# Lint; it does not spend five macOS-runner minutes producing artifacts that
# nothing downloads. The cost of that is real and worth knowing: the Android
# and iOS cross-builds are not compiled on a branch push, so a break in them is
# caught when a tag is pushed rather than when the code lands. Run this
# workflow by hand (Actions -> Run workflow) before tagging if a change touched
# the FFI, the JNI layer or the build scripts.
on:
  push:
    tags: [ 'v*' ]
  # Nightly, on the default branch: the seven release builds, so the
  # caches a tag build restores exist and are warm, and so a toolchain or
  # dependency drift shows up on a quiet morning rather than at release.
  # Not on pull requests any more: that was the whole release matrix, about
  # ninety CI minutes and twelve macOS minutes per push, for a smoke loop
  # that test.yml now runs on the debug binary it already builds.
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        # Set by release-apple.yml: build on this branch and upload the
        # archives to the draft release of that name. Empty for a plain
        # dispatch, which builds and uploads nothing.
        description: 'Draft release to upload the archives to (release-apple.yml sets this)'
        default: ''

permissions:
  contents: read

# A release dispatch (release_tag set) is in a group of its own, by run id,
# and is never cancelled: it was sharing `<workflow>-refs/heads/mobile` with
# every other run on the branch, so on 2026-10-28 a re-run of an older
# release build cancelled the 0.9.0 finish run's fresh one, and the 03:xx
# nightly would have cancelled any release build still going. The event is
# in the group so the nightly and a branch push do not cancel each other
# either. Everything else keeps the newest-run-wins rule.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.release_tag && format('release-{0}', github.run_id) || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ !inputs.release_tag }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # The nightly's reason to run is a change since the last one: a nightly
  # over an unchanged `mobile` rebuilds what the last one built. So a
  # scheduled run first asks whether HEAD differs from the last successful
  # scheduled run's commit, and skips when it does not -- unless that run is
  # six days old, so the caches it keeps warm are touched inside GitHub's
  # seven-day eviction window. Any other event runs, and so does a nightly
  # whose question cannot be answered.
  changed:
    name: Changed since the last nightly
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          WORKFLOW: build.yml
        run: |
          set -uo pipefail
          if [ "$EVENT" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The last successful scheduled run that built something. A night
          # this job skipped also ends in success, and must not count, or an
          # unchanged branch would never reach the six-day refresh.
          last=""
          runs=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --event schedule \
                   --status success --limit 20 --json databaseId,headSha,createdAt \
                   --jq '.[] | "\(.databaseId) \(.headSha) \(.createdAt)"' 2>/dev/null) || runs=""
          while read -r id run_sha run_created; do
            [ -n "$id" ] || continue
            built=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                      --jq '[.jobs[] | select(.name != "Changed since the last nightly"
                                              and .conclusion == "success")] | length' \
                      2>/dev/null) || built=0
            if [ "${built:-0}" -gt 0 ]; then last="$run_sha $run_created"; break; fi
          done <<< "$runs"
          sha=${last%% *}; created=${last#* }
          if [ -z "$last" ] || [ "$sha" != "$GITHUB_SHA" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "running: last successful nightly was at ${sha:-none}, HEAD is $GITHUB_SHA"
          elif [ $(( $(date +%s) - $(date -d "$created" +%s) )) -gt $(( 6 * 86400 )) ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "running: HEAD unchanged, but the last nightly ($created) is six days old"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skipping: the nightly of $created already built $GITHUB_SHA"
          fi

  build:
    # Named by the friendly asset name, not the target triple: the triple's
    # "unknown" vendor is rustc's identifier and still what we build, but it
    # has no business in a check list a human scans.
    name: Build ${{ matrix.asset_name }}
    needs: changed
    if: needs.changed.outputs.run == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every leg builds natively on a runner of its own architecture —
          # the arm64 hosted runners are free for public repositories — so
          # every leg can also run the binary it built. `cross` and its
          # docker images are gone with the cross-compilation; the musl legs
          # need only the musl-tools package and a linker setting.
          # asset_name is the friendly name used for the release download; the
          # target triple (with its "unknown" vendor) is still what we build.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: shoes
            asset_name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: shoes
            asset_name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary_name: shoes
            asset_name: linux-arm64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            binary_name: shoes
            asset_name: linux-arm64-musl

          # macOS build. Intel macOS was dropped deliberately: nothing
          # deploys there.
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: shoes
            asset_name: macos-arm64

          # Windows builds. wintun.dll is deliberately not bundled: it is
          # WireGuard's signed binary with its own license, the loader
          # verifies its signature at runtime, and CONFIG.md tells users
          # where to get it.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: shoes.exe
            asset_name: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            binary_name: shoes.exe
            asset_name: windows-arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aws-lc build tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/aws-lc-tools

      # musl-gcc from musl-tools targets the host architecture, which is the
      # target architecture on these native runners — the whole reason cross
      # could go.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # cache-on-failure, because the run that needs the cache most is the
      # retry of one that just failed.
      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' }}

      # The musl env vars point cargo's linker and cc-rs (aws-lc-sys,
      # jemalloc, blake3 all compile C) at musl-gcc for the musl targets;
      # they name a specific triple each, so every other leg ignores them.
      - name: Build binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # This step used to end in `|| echo "Binary test failed, but file
      # exists"`, so the binary could fail to run and the job still went green.
      # A check that cannot fail is not a check.
      #
      # shell: bash on every runner: the Windows runner's default is
      # PowerShell, which parses none of this.
      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          ls -la "$bin"
          file "$bin"

      # There is no --help; the binary rejects it and prints usage with a
      # non-zero status. -V is the flag that exists. The dry runs are the part
      # with real value: each parses a config end to end without binding a
      # port, and they cover the config paths the mobile work added. Only
      # cert-free examples can be used -- the rest reference PEM files that
      # are not in the repository.
      #
      # Every leg runs this, not just x86_64-linux-gnu: the binaries run on
      # the runner that built them now, and an arm64 or musl artifact that
      # failed on startup used to be exactly what this could not catch. Only
      # the example list varies — TUN configs are validated by target-gated
      # arms, so each platform dry-runs the ones its own arm accepts;
      # tun_windows.yaml in particular is the one config no non-Windows
      # runner can push through the Windows validation it exists to exercise.
      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          "$bin" --version

          configs="socks_basic multi_hop_chain sniff hysteria2_client tuic_client mieru_client reality_client socks_through_wss_vmess"
          case "$RUNNER_OS" in
            Linux) configs="$configs tun_vpn tun_fake_ip tun_windows amneziawg_client transparent_proxy" ;;
            Windows) configs="$configs tun_windows" ;;
            macOS) configs="$configs amneziawg_client tun_macos" ;;
          esac

          for cfg in $configs; do
            echo "==> dry run: examples/$cfg.yaml"
            "$bin" --dry-run "examples/$cfg.yaml"
          done

          # rule_set.yaml names two .srs files that are not kept in examples/.
          # The test fixtures are the same lists under the same names, so
          # copying them in covers the rule-set path -- which reads and parses
          # a binary format at startup, and is worth exercising on the release
          # binary rather than only in unit tests.
          cp tests/data/rule_sets/geosite-google.srs tests/data/rule_sets/geoip-ru.srs examples/
          echo "==> dry run: examples/rule_set.yaml"
          "$bin" --dry-run examples/rule_set.yaml
          rm -f examples/geosite-google.srs examples/geoip-ru.srs

      # No `strip` here: the release profile already sets strip = true
      # (Cargo.toml), so running it again was a no-op that could only fail.
      # tar.gz on Windows too: Windows 11 opens it natively, and one format
      # keeps the release job's collection glob honest.
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tarball="${{ github.event.repository.name }}-${{ matrix.asset_name }}.tar.gz"
          tar -czf "artifacts/$tarball" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          ls -la "artifacts/$tarball"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.asset_name }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

      # The privileged daemon, macOS, Linux and Windows, and its own artifact.
      #
      # Its own cargo invocation because features are additive per build:
      # folding `--features daemon` into the step above would compile
      # control-stats and control-logs into the `shoes` CLI as well, which is
      # a different binary for a different audience. Its own tarball for the
      # same reason, plus one the consumer cares about — a Gradle task fetches
      # it by asset name and checks the SHA-256 the API reports, so the name
      # has to be stable and mean one thing.
      #
      # protoc is an install step rather than a crate: prost-build stopped
      # vendoring one.
      # gnu only, never musl. A statically linked musl build uses musl's own
      # `getpwuid_r` and `getgrnam`, which read /etc/passwd and /etc/group
      # directly and know nothing of NSS plugins -- so on a host with SSSD- or
      # LDAP-backed accounts both the peer-credential check and install-time
      # group detection would fail to resolve a real user, giving a daemon that
      # refuses everyone with nothing in the error saying why.
      - name: Install protoc
        uses: ./.github/actions/protoc

      # A bare shoesd.exe, as the CLI's Windows release is: wintun.dll is not
      # bundled, for the reason given on the matrix entries above. `shoesd
      # install` copies it from beside the executable, so the packager -- KVN's
      # MSI -- ships it there.
      - name: Build and package shoesd (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --features daemon \
            --bin shoesd --target ${{ matrix.target }}
          "target/${{ matrix.target }}/release/shoesd.exe" --version
          mkdir -p daemon-artifacts
          tar -czf "daemon-artifacts/shoesd-${{ matrix.asset_name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" shoesd.exe
          ls -la daemon-artifacts/

      - name: Build and package shoesd
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --features daemon \
            --bin shoesd --target ${{ matrix.target }}
          bin="target/${{ matrix.target }}/release/shoesd"
          file "$bin"
          "$bin" --version
          mkdir -p daemon-artifacts
          tar -czf "daemon-artifacts/shoesd-${{ matrix.asset_name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" shoesd
          ls -la daemon-artifacts/

      - name: Upload shoesd
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shoesd-${{ matrix.asset_name }}
          path: daemon-artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    # On a tag push, or when release-apple.yml dispatched this run with the
    # draft's name: the archives go to that release, created here only for
    # a hand-pushed tag that has none yet.
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      # gh, not action-gh-release: the release usually exists already as
      # a draft that release-apple.yml created and will publish, and gh
      # resolves a draft by its tag name. A tag pushed by hand gets a
      # published release created here, with generated notes.
      - name: Upload to the release
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release-artifacts/*
