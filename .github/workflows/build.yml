name: Build Binaries

# Tags only, plus pull requests and manual runs. A branch push runs Test and
# Lint; it does not spend five macOS-runner minutes producing artifacts that
# nothing downloads. The cost of that is real and worth knowing: the Android
# and iOS cross-builds are not compiled on a branch push, so a break in them is
# caught when a tag is pushed rather than when the code lands. Run this
# workflow by hand (Actions -> Run workflow) before tagging if a change touched
# the FFI, the JNI layer or the build scripts.
on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, mobile ]
    # A docs-only PR does not need seven release builds; Test and Lint still
    # run on it and are the checks with jurisdiction over prose.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      # Swift-only changes are mobile.yml's business.
      - 'swift/**'
      - 'Package.swift'
      - '.swift-format'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Named by the friendly asset name, not the target triple: the triple's
    # "unknown" vendor is rustc's identifier and still what we build, but it
    # has no business in a check list a human scans.
    name: Build ${{ matrix.asset_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every leg builds natively on a runner of its own architecture —
          # the arm64 hosted runners are free for public repositories — so
          # every leg can also run the binary it built. `cross` and its
          # docker images are gone with the cross-compilation; the musl legs
          # need only the musl-tools package and a linker setting.
          # asset_name is the friendly name used for the release download; the
          # target triple (with its "unknown" vendor) is still what we build.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary_name: shoes
            asset_name: linux-x86_64
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary_name: shoes
            asset_name: linux-x86_64-musl
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            binary_name: shoes
            asset_name: linux-arm64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            binary_name: shoes
            asset_name: linux-arm64-musl

          # macOS build. Intel macOS was dropped deliberately: nothing
          # deploys there.
          - target: aarch64-apple-darwin
            os: macos-latest
            binary_name: shoes
            asset_name: macos-arm64

          # Windows builds. wintun.dll is deliberately not bundled: it is
          # WireGuard's signed binary with its own license, the loader
          # verifies its signature at runtime, and CONFIG.md tells users
          # where to get it.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary_name: shoes.exe
            asset_name: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            binary_name: shoes.exe
            asset_name: windows-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aws-lc build tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/aws-lc-tools

      # musl-gcc from musl-tools targets the host architecture, which is the
      # target architecture on these native runners — the whole reason cross
      # could go.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # cache-on-failure, because the run that needs the cache most is the
      # retry of one that just failed.
      - name: Setup cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      # The musl env vars point cargo's linker and cc-rs (aws-lc-sys,
      # jemalloc, blake3 all compile C) at musl-gcc for the musl targets;
      # they name a specific triple each, so every other leg ignores them.
      - name: Build binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # This step used to end in `|| echo "Binary test failed, but file
      # exists"`, so the binary could fail to run and the job still went green.
      # A check that cannot fail is not a check.
      #
      # shell: bash on every runner: the Windows runner's default is
      # PowerShell, which parses none of this.
      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          ls -la "$bin"
          file "$bin"

      # There is no --help; the binary rejects it and prints usage with a
      # non-zero status. -V is the flag that exists. The dry runs are the part
      # with real value: each parses a config end to end without binding a
      # port, and they cover the config paths the mobile work added. Only
      # cert-free examples can be used -- the rest reference PEM files that
      # are not in the repository.
      #
      # Every leg runs this, not just x86_64-linux-gnu: the binaries run on
      # the runner that built them now, and an arm64 or musl artifact that
      # failed on startup used to be exactly what this could not catch. Only
      # the example list varies — TUN configs are validated by target-gated
      # arms, so each platform dry-runs the ones its own arm accepts;
      # tun_windows.yaml in particular is the one config no non-Windows
      # runner can push through the Windows validation it exists to exercise.
      - name: Smoke test binary
        shell: bash
        run: |
          set -euo pipefail
          bin="./target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          "$bin" --version

          configs="socks_basic multi_hop_chain sniff hysteria2_client tuic_client mieru_client"
          case "$RUNNER_OS" in
            Linux) configs="$configs tun_vpn tun_fake_ip tun_windows amneziawg_client" ;;
            Windows) configs="$configs tun_windows" ;;
            macOS) configs="$configs amneziawg_client tun_macos" ;;
          esac

          for cfg in $configs; do
            echo "==> dry run: examples/$cfg.yaml"
            "$bin" --dry-run "examples/$cfg.yaml"
          done

          # rule_set.yaml names two .srs files that are not kept in examples/.
          # The test fixtures are the same lists under the same names, so
          # copying them in covers the rule-set path -- which reads and parses
          # a binary format at startup, and is worth exercising on the release
          # binary rather than only in unit tests.
          cp tests/data/rule_sets/geosite-google.srs tests/data/rule_sets/geoip-ru.srs examples/
          echo "==> dry run: examples/rule_set.yaml"
          "$bin" --dry-run examples/rule_set.yaml
          rm -f examples/geosite-google.srs examples/geoip-ru.srs

      # No `strip` here: the release profile already sets strip = true
      # (Cargo.toml), so running it again was a no-op that could only fail.
      # tar.gz on Windows too: Windows 11 opens it natively, and one format
      # keeps the release job's collection glob honest.
      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tarball="${{ github.event.repository.name }}-${{ matrix.asset_name }}.tar.gz"
          tar -czf "artifacts/$tarball" \
            -C "target/${{ matrix.target }}/release" "${{ matrix.binary_name }}"
          ls -la "artifacts/$tarball"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.asset_name }}
          path: artifacts/*.tar.gz
          if-no-files-found: error

      # The privileged daemon, macOS and Linux, and its own artifact.
      #
      # Its own cargo invocation because features are additive per build:
      # folding `--features daemon` into the step above would compile
      # control-stats and control-logs into the `shoes` CLI as well, which is
      # a different binary for a different audience. Its own tarball for the
      # same reason, plus one the consumer cares about — a Gradle task fetches
      # it by asset name and checks the SHA-256 the API reports, so the name
      # has to be stable and mean one thing.
      #
      # protoc is an install step rather than a crate: prost-build stopped
      # vendoring one.
      # gnu only, never musl. A statically linked musl build uses musl's own
      # `getpwuid_r` and `getgrnam`, which read /etc/passwd and /etc/group
      # directly and know nothing of NSS plugins -- so on a host with SSSD- or
      # LDAP-backed accounts both the peer-credential check and install-time
      # group detection would fail to resolve a real user, giving a daemon that
      # refuses everyone with nothing in the error saying why.
      - name: Install protoc (macOS)
        if: matrix.target == 'aarch64-apple-darwin'
        run: brew install protobuf

      - name: Install protoc (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Build and package shoesd
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --features daemon \
            --bin shoesd --target ${{ matrix.target }}
          bin="target/${{ matrix.target }}/release/shoesd"
          file "$bin"
          "$bin" --version
          mkdir -p daemon-artifacts
          tar -czf "daemon-artifacts/shoesd-${{ matrix.asset_name }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" shoesd
          ls -la daemon-artifacts/

      - name: Upload shoesd
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: shoesd-${{ matrix.asset_name }}
          path: daemon-artifacts/*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-artifacts/*
          # Published, not a draft: a tag push should produce a visible release
          # with the artifacts attached, not one that waits for a manual click.
          draft: false
          generate_release_notes: true
