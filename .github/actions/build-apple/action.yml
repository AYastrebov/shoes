name: Build the Apple XCFramework
description: >
  Toolchain, caches, cbindgen, and scripts/build-apple.sh. One definition,
  used by mobile.yml's apple job (the build PRs exercise) and by
  release-apple.yml (the build that ships) -- so the two cannot drift and the
  released artifact is built exactly as CI tested it.
runs:
  using: composite
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        targets: aarch64-apple-ios,aarch64-apple-ios-sim,aarch64-apple-darwin

    - name: Cache Rust build
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        key: apple
        cache-on-failure: true

    # cbindgen has no taiki-e/install-action manifest, so it is cached as a
    # binary the same way cargo-ndk is elsewhere. Building it from source on
    # every run cost minutes on the most expensive runner in the pipeline.
    - name: Cache cbindgen binary
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/cbindgen
        key: cbindgen-${{ runner.os }}-v1

    - name: Install cbindgen
      shell: bash
      run: command -v cbindgen || cargo install cbindgen --locked

    - name: Build XCFramework
      shell: bash
      run: bash scripts/build-apple.sh
