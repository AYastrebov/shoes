name: Install protoc
description: >
  The protobuf compiler the daemon's build script needs, per runner OS.
  One definition for lint.yml, test.yml and build.yml, which each carried
  a copy of the same three steps and the same Windows retry loop.
runs:
  using: composite
  steps:
    - name: Install protoc (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install protobuf

    - name: Install protoc (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

    # Chocolatey's CDN fails a download now and then; three attempts with
    # a growing pause, and a hard failure if none installed it.
    - name: Install protoc (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        foreach ($attempt in 1..3) {
          choco install protoc --no-progress -y
          if (Get-Command protoc -ErrorAction SilentlyContinue) { break }
          Write-Host "protoc is not installed after attempt $attempt"
          if ($attempt -lt 3) { Start-Sleep -Seconds (30 * $attempt) }
        }
        if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
          Write-Error "protoc could not be installed from Chocolatey"
          exit 1
        }
        protoc --version
