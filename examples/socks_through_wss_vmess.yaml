# A SOCKS5 server that forwards connections through a VMess WSS proxy.
- address: 127.0.0.1:5443
  transport: tcp
  protocol:
    type: socks
    username: secretuser
    password: secretpass
  rules:
    # Directly connect to 192.168.*
    - mask: 192.168.0.0/16
      action: allow
      # client_chain: direct is optional - direct is the default when omitted
      client_chain: direct
    # Forward all other connection requests through a Vmess WSS server.
    - mask: 0.0.0.0/0
      action: allow
      client_chain:
        address: 127.0.0.1:1234
        protocol:
          type: tls
          # Set to false to disable TLS verification, if, for example, the upstream server
          # uses a self-signed certificate
          verify: true
          protocol:
            type: ws
            # The path to the websocket server
            matching_path: /ws
            # Carry up to this many bytes of the first write in the upgrade
            # request, as sing-box's client does (0, the default, sends none).
            # The server must expect it: sing-box reads it from the path,
            # Xray from the Sec-WebSocket-Protocol header.
            max_early_data: 2048
            early_data_header_name: Sec-WebSocket-Protocol
            protocol:
              type: vmess
              cipher: aes-128-gcm
              user_id: b0e80a62-8a51-47f0-91f1-f0f7faf8d9d4
