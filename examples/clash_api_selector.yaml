# A selector group switched from a Clash dashboard or awg-manager.
#
# `mode: select` makes every new connection through `exit` take one chosen
# member instead of rotating. `PUT /proxies/exit` with {"name": "eu-2"}
# changes the choice at runtime (open connections keep theirs), `DELETE`
# goes back to `default`, and `state_file` brings the choice back after a
# restart. Members are named outbounds -- `name` is what the controller
# shows and what a selection names.
- client_group: exit
  mode: select
  default: eu-1
  client_proxies:
    - name: eu-1
      address: "eu1.example.com:1080"
      protocol:
        type: socks
    - name: eu-2
      address: "eu2.example.com:1080"
      protocol:
        type: socks
    - direct          # A group of one outbound is one member too.

- address: "127.0.0.1:1080"
  protocol:
    type: socks
  rules:
    - masks: "0.0.0.0/0"
      action: allow
      client_chain: exit

- clash_api:
    listen: 127.0.0.1:9090
    secret: change-me
    state_file: /var/lib/shoes/clash-api.json
